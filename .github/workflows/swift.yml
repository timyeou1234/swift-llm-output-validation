name: Swift validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.2.1-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build -c release
      - run: swift test --enable-code-coverage
      - run: swift test -c release
      - run: bash scripts/check-examples.sh

  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build -c release
      - run: swift test --enable-code-coverage
      - run: swift test -c release
      - run: bash scripts/check-examples.sh
